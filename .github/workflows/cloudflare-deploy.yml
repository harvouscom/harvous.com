# Builds the Astro site and deploys it to Cloudflare Workers.
#
# Two targets, both from this one file:
#   production — every push to main. Draft pages stripped.
#   staging    — manual only (Actions → Run workflow). Keeps draft pages so
#                /3/ can be reviewed before launch, and the Worker stamps
#                X-Robots-Tag: noindex on everything it serves.
#
# Netlify keeps deploying main in parallel as the rollback during the soak
# week; nothing here touches netlify.toml.
#
# Repository secrets required:
#   CLOUDFLARE_API_TOKEN   — Workers Scripts:Edit and D1:Edit on the account
#   CLOUDFLARE_ACCOUNT_ID
#
# The three HERESMYCHURCH_* values are Worker secrets (`wrangler secret put`),
# not build inputs — `wrangler deploy` leaves existing secrets alone, so they
# are set once per Worker and never travel through CI.

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "docs/**"
  workflow_dispatch:
    inputs:
      target:
        description: "Which Worker to deploy"
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: cloudflare-deploy-${{ github.event.inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target
        id: target
        run: echo "name=${{ (github.event_name == 'workflow_dispatch' && inputs.target) || 'production' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Fetch the site's videos from LFS
        # Only public/, never video/footage/ — that is 371 MB of Remotion
        # source which is not a site asset. ~37 MB a run, not ~469 MB.
        #
        # Cloudflare does not actually serve these from dist/; its Worker
        # takes those paths ahead of the asset router and reads R2, because
        # static assets cannot do byte ranges. They are in the build for
        # Netlify's sake, which serves them as files and can only serve what
        # it was given. AFTER THE DNS CUTOVER this step and the files both go.
        run: git lfs pull --include="public/*.mp4"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --prefer-offline --no-audit

      - name: Build
        run: npm run build
        env:
          # astro.config.mjs keepsDraftPages(): "1" keeps them, unset strips.
          KEEP_DRAFT_PAGES: ${{ steps.target.outputs.name == 'staging' && '1' || '' }}

      - name: Probe which services the CI token can reach
        # Temporary. Each probe is a read; continue-on-error so we see all three
        # rather than stopping at the first refusal. Prints no secret values.
        continue-on-error: true
        run: |
          echo "--- D1 (needs D1) ---"
          npx wrangler d1 list           && echo "D1 OK"      || echo "D1 DENIED"
          echo "--- R2 (needs Workers R2 Storage) ---"
          npx wrangler r2 bucket list    && echo "R2 OK"      || echo "R2 DENIED"
          echo "--- Workers (needs Workers Scripts) ---"
          npx wrangler deployments list  && echo "WORKERS OK" || echo "WORKERS DENIED"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        # Before the deploy, so new code never meets an old schema. Wrangler
        # only runs migrations the target database has not recorded, so this is
        # a no-op on the runs that change nothing.
        run: npx wrangler d1 migrations apply ${{ steps.target.outputs.name == 'staging' && 'harvous-com-staging --env staging' || 'harvous-com' }} --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        # npx, not wrangler-action, so the deploy uses the wrangler version
        # pinned in package.json rather than whatever the action resolves.
        run: npx wrangler deploy ${{ steps.target.outputs.name == 'staging' && '--env staging' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
